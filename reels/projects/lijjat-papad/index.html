<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=block" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;width:1080px;height:1920px;overflow:hidden}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Poppins,'DejaVu Sans',sans-serif}
  .scene{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,filter,opacity}
  .inner{position:absolute;inset:0;transform-origin:50% 45%}
  svg{position:absolute;inset:0}
  .pill{position:absolute;left:50%;white-space:nowrap;font-weight:800;border-radius:999px;padding:14px 40px;
        transform-origin:50% 50%;box-shadow:0 10px 0 rgba(0,0,0,.25);letter-spacing:1px}
  #subs{position:absolute;z-index:300;left:0;right:0;top:1395px;display:flex;justify-content:center;pointer-events:none}
  #subs div{max-width:820px;text-align:center;font-weight:700;font-size:50px;line-height:1.25;color:#fff;
        background:rgba(15,8,35,.62);padding:18px 38px;border-radius:28px}
  #handle{position:absolute;z-index:300;left:50%;top:205px;transform:translateX(-50%);color:#fff;font-weight:700;font-size:34px;
        opacity:.85;text-shadow:0 3px 8px rgba(0,0,0,.5);letter-spacing:1px}
  #ring{position:absolute;border-radius:50%;pointer-events:none}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="wi" viewBox="-20 -34 40 60" overflow="visible">
      <path d="M-11,-8 Q0,-12 11,-8 L18,22 Q0,27 -18,22Z" fill="currentColor"/>
      <path d="M-18,22 Q0,27 18,22 L17.5,19 Q0,24 -17.5,19Z" fill="#FFD166"/>
      <circle cx="0" cy="-19" r="9" fill="#B5713D"/>
      <path d="M-9.5,-19 Q-9.5,-30 0,-29.5 Q9.5,-30 9.5,-19 Q8,-25 0,-25 Q-8,-25 -9.5,-19Z" fill="#22160F"/>
      <circle cx="0" cy="-23" r="1.4" fill="#E63946"/>
    </symbol>
  </defs>
</svg>
<div id="stage"></div>
<script>
const W=1080,H=1920;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eOut=t=>1-Math.pow(1-t,3);
const eIn=t=>t*t*t;
const eInOut=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
const prog=(lt,d,dur=.4)=>clamp((lt-d)/dur);
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;}}
const fmt=n=>Math.round(n).toLocaleString('en-IN');

/* ---------- reusable pieces ---------- */
function hl(text,y,lt,d,size,fill,o={}){ // big headline (SVG text with outline)
  const p=prog(lt,d,.42); if(p<=0) return '';
  const sc=eBack(p), op=clamp(p*3);
  const stroke=o.stroke||'#1A1033', sw=o.sw||size*0.09;
  return `<g transform="translate(${o.x||540},${y}) scale(${sc}) rotate(${(o.rot||0)*(1-p)})" opacity="${op}">
    <text x="0" y="${size*0.1}" text-anchor="middle" dominant-baseline="middle" font-family="Poppins" font-weight="900"
      font-size="${size}" fill="rgba(0,0,0,.32)" transform="translate(0,${size*0.07})" stroke="rgba(0,0,0,.32)" stroke-width="${sw}" stroke-linejoin="round">${text}</text>
    <text x="0" y="${size*0.1}" text-anchor="middle" dominant-baseline="middle" font-family="Poppins" font-weight="900"
      font-size="${size}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" paint-order="stroke">${text}</text></g>`;
}
function pill(text,y,lt,d,bg,fg,size=44,o={}){ // HTML tag pill
  const p=prog(lt,d,.38); if(p<=0) return '';
  const sc=eBack(p);
  return `<div class="pill" style="top:${y}px;font-size:${size}px;background:${bg};color:${fg};
     transform:translate(calc(-50% + ${o.dx||0}px),-50%) scale(${sc}) rotate(${o.rot||0}deg);opacity:${clamp(p*3)}">${text}</div>`;
}
function woman(cx,cy,s,saree,o={}){
  const skin=o.skin||'#B5713D', hair=o.grey?'#D9D4CF':'#22160F';
  const blink=o.blink||0, eyeH=lerp(4.6,0.8,blink);
  const armL=o.armL||0, armR=o.armR||0;
  return `<g transform="translate(${cx},${cy}) scale(${s})">
    <circle cx="30" cy="-150" r="25" fill="${hair}"/>
    ${o.headCover?`<path d="M-62,-110 Q-60,-190 0,-192 Q60,-190 62,-110 L70,-40 L-70,-40Z" fill="${saree}"/>
      <path d="M-62,-110 Q-60,-190 0,-192 Q60,-190 62,-110" fill="none" stroke="#FFD166" stroke-width="10"/>`:''}
    <path d="M-60,-55 Q0,-80 60,-55 L115,95 Q0,122 -115,95Z" fill="${saree}"/>
    <path d="M-60,-55 L25,-64 L108,78 L58,92Z" fill="#fff" opacity=".2"/>
    <path d="M-115,95 Q0,122 115,95 L111,79 Q0,106 -111,79Z" fill="#FFD166"/>
    <path d="M25,-64 L108,78" stroke="#FFD166" stroke-width="9"/>
    <rect x="-14" y="-84" width="28" height="32" rx="10" fill="${skin}"/>
    <circle cx="0" cy="-118" r="44" fill="${skin}"/>
    <path d="M-46,-116 Q-48,-168 0,-166 Q48,-168 46,-116 Q42,-150 4,-152 L0,-140 L-4,-152 Q-42,-150 -46,-116Z" fill="${hair}"/>
    <circle cx="0" cy="-134" r="5" fill="#E63946"/>
    <ellipse cx="-16" cy="-114" rx="4.6" ry="${eyeH}" fill="#1E120B"/>
    <ellipse cx="16" cy="-114" rx="4.6" ry="${eyeH}" fill="#1E120B"/>
    ${o.glasses?`<g fill="none" stroke="#6B4F3A" stroke-width="3.5"><circle cx="-16" cy="-114" r="13"/><circle cx="16" cy="-114" r="13"/><path d="M-3,-114 H3"/></g>`:''}
    <circle cx="-26" cy="-100" r="7" fill="#F28C8C" opacity=".45"/><circle cx="26" cy="-100" r="7" fill="#F28C8C" opacity=".45"/>
    <path d="M-15,-96 Q0,-83 15,-96" stroke="#5A2D14" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="-45" cy="-104" r="5.5" fill="#FFD166"/><circle cx="45" cy="-104" r="5.5" fill="#FFD166"/>
    ${o.noArms?'':`<path d="M-52,-42 Q-86,${18+armL} -30,${52+armL}" stroke="${skin}" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M52,-42 Q86,${18+armR} 30,${52+armR}" stroke="${skin}" stroke-width="24" fill="none" stroke-linecap="round"/>
    <path d="M-46,${40+armL} l12,10" stroke="#F72585" stroke-width="7" stroke-linecap="round"/>
    <path d="M46,${40+armR} l-12,10" stroke="#06D6A0" stroke-width="7" stroke-linecap="round"/>`}
  </g>`;
}
function papad(cx,cy,r,seed,o={}){
  const R=rng(seed); let spots='';
  for(let i=0;i<Math.round(r*0.35);i++){const a=R()*6.283,d=Math.sqrt(R())*r*0.9;
    spots+=`<circle cx="${(cx+Math.cos(a)*d).toFixed(1)}" cy="${(cy+Math.sin(a)*d*(o.squash||1)).toFixed(1)}" r="${(r*(0.012+R()*0.03)).toFixed(1)}" fill="${R()<.6?'#C9861A':'#FFE08A'}" opacity="${(.5+R()*.5).toFixed(2)}"/>`;}
  return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*(o.squash||1)}" fill="#F4B942" stroke="#D99A22" stroke-width="${r*0.03}"/>
          <ellipse cx="${cx-r*.12}" cy="${cy-r*.12*(o.squash||1)}" rx="${r*.7}" ry="${r*.7*(o.squash||1)}" fill="#FFD36B" opacity=".55"/>${spots}`;
}
function dust(n,seed,lt,col='#fff',area=[0,0,W,H]){
  const R=rng(seed); let s='';
  for(let i=0;i<n;i++){const x=area[0]+R()*area[2], y=area[1]+R()*area[3], sp=10+R()*30, r=2+R()*6, ph=R()*6.28;
    s+=`<circle cx="${(x+Math.sin(lt*0.8+ph)*20).toFixed(1)}" cy="${(y-lt*sp).toFixed(1)}" r="${r.toFixed(1)}" fill="${col}" opacity="${(0.25+0.35*Math.sin(lt*2+ph)**2).toFixed(2)}"/>`;}
  return s;
}
function sparkles(n,seed,lt,cols){
  const R=rng(seed); let s='';
  for(let i=0;i<n;i++){const x=60+R()*960,y=200+R()*1500,ph=R()*6.28,sz=10+R()*22,c=cols[i%cols.length];
    const k=Math.max(0,Math.sin(lt*3+ph)); if(k<.05) continue;
    s+=`<path transform="translate(${x.toFixed(0)},${y.toFixed(0)}) scale(${(k*sz/10).toFixed(2)}) rotate(${(lt*40+ph*50).toFixed(0)})" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z" fill="${c}"/>`;}
  return s;
}
function confetti(lt,t0,seed,n=70){
  const t=lt-t0; if(t<0||t>2.2) return '';
  const R=rng(seed),cols=['#FFD60A','#F72585','#4CC9F0','#06D6A0','#FF7F11','#fff']; let s='';
  for(let i=0;i<n;i++){const a=-Math.PI/2+(R()-.5)*2.6, v=900+R()*900, x=540+Math.cos(a)*v*t, y=900+Math.sin(a)*v*t+900*t*t, rot=R()*360+t*600;
    s+=`<rect x="-9" y="-14" width="18" height="28" rx="4" fill="${cols[i%6]}" transform="translate(${x.toFixed(0)},${y.toFixed(0)}) rotate(${rot.toFixed(0)})" opacity="${clamp(2.2-t).toFixed(2)}"/>`;}
  return s;
}
const bgGrad=(id,a,b,angle=90)=>`<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="1080" height="1920" fill="url(#${id})"/>`;
const radial=(id,c,op=.5,cx=540,cy=900,r=900)=>`<defs><radialGradient id="${id}" cx="${cx}" cy="${cy}" r="${r}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${c}" stop-opacity="${op}"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></radialGradient></defs><rect width="1080" height="1920" fill="url(#${id})"/>`;

/* ---------- scenes ---------- */
const S=[];
// 1. Hook
S.push({d:2, f(lt){
  let notes='';
  [[-14,250,1330],[8,300,1395],[-4,215,1450]].forEach(([r,x,y],i)=>{
    notes+=`<g transform="translate(${x},${y}) rotate(${r})"><rect x="-200" y="-95" width="400" height="190" rx="14" fill="${['#7CC08A','#9AD3A0','#86C79A'][i]}" stroke="#4E8F5C" stroke-width="6"/>
      <rect x="-180" y="-75" width="360" height="150" rx="8" fill="none" stroke="#4E8F5C" stroke-width="3" opacity=".7"/>
      <circle cx="90" cy="0" r="52" fill="#B7E2BE" stroke="#4E8F5C" stroke-width="4"/>
      <text x="-80" y="22" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="74" fill="#3E7A4B">₹10</text></g>`;});
  const sv=`${bgGrad('g1','#0FB5AE','#065E63')}${radial('r1','#FFF4C2',.45,640,700,900)}
   <polygon points="700,0 1080,0 1080,500 300,1920 0,1920 0,1500" fill="#FFF6D5" opacity=".08"/>
   <ellipse cx="560" cy="1140" rx="390" ry="250" fill="rgba(0,0,0,.25)"/>
   <ellipse cx="560" cy="1100" rx="380" ry="240" fill="#C9D2D8" stroke="#E9EEF1" stroke-width="10"/>
   <ellipse cx="560" cy="1100" rx="300" ry="185" fill="#AEB9C1"/>
   <ellipse cx="500" cy="1040" rx="140" ry="40" fill="#fff" opacity=".35"/>
   <g transform="translate(0,${Math.sin(lt*2)*4})">${papad(585,1085,250,7,{squash:.62})}</g>
   ${notes}${dust(30,11,lt,'#FFF6D5')}
   ${hl('₹80',560,lt,.1,300,'#FFD60A')}`;
  return {svg:sv, html:pill('UDHAAR',800,lt,.45,'#F72585','#fff',52)};
}});
// 2. Count-up to 1,600 crore
S.push({d:2.5, f(lt){
  const N=Math.floor(eOut(clamp(lt/1.7))*15); let st='';
  for(let i=0;i<N;i++){const y=1640-i*52; st+=papad(540+Math.sin(i*1.7)*14,y,230,100+i,{squash:.32});}
  const v=lerp(80,1600,eInOut(clamp((lt-.1)/1.2)));
  return {svg:`${bgGrad('g2','#FFB703','#FB5607')}${radial('r2','#FFF',.35,540,700,800)}
     ${sparkles(26,5,lt,['#fff','#FFD60A','#F72585'])}${st}${confetti(lt,1.35,9)}
     ${hl('₹'+fmt(v),520,lt,0,v>999?230:280,'#fff',{stroke:'#7A1F00'})}`,
   html:pill('CRORE KA BRAND',740,lt,1.3,'#1A1033','#FFD60A',56)};
}});
// 3. 1959 Mumbai
S.push({d:2.5, f(lt){
  const tilt=lerp(180,0,eOut(clamp(lt/2.5)));
  const R=rng(3); let win='';
  for(let r=0;r<9;r++)for(let c=0;c<5;c++){const x=230+c*130,y=840+r*150;
    win+=`<path d="M${x},${y+80} V${y+25} Q${x+35},${y-8} ${x+70},${y+25} V${y+80}Z" fill="#14706B"/>
      <path d="M${x-12},${y+92} H${x+82}" stroke="#F7F1E3" stroke-width="10"/>`;
    if(R()<.45){const col=['#F72585','#FFD60A','#7209B7','#FF7F11','#4361EE'][Math.floor(R()*5)], sw=Math.sin(lt*3+r+c)*6;
      win+=`<path d="M${x-5},${y+96} H${x+75}" stroke="#6B5B4B" stroke-width="2"/><path d="M${x+10},${y+96} l${-4+sw},50 h34 l${4+sw},-50Z" fill="${col}"/>`;}}
  let birds=''; for(let i=0;i<5;i++){const bx=(lt*120+i*190)%1300-150, by=380+i*60+Math.sin(lt*4+i)*10;
    birds+=`<path d="M${bx-18},${by} Q${bx-9},${by-12} ${bx},${by} Q${bx+9},${by-12} ${bx+18},${by}" stroke="#5A2D14" stroke-width="4" fill="none"/>`;}
  const digits='1959'.split(''); let yr='';
  digits.forEach((dg,i)=>{yr+=hl(dg,470,lt,.15+i*.12,260,['#FFD60A','#FFD60A','#FFD60A','#06D6A0'][i],{x:345+i*130});});
  return {svg:`${bgGrad('g3','#FFC97E','#FF6F61')}
    <circle cx="830" cy="640" r="${150+Math.sin(lt*2)*6}" fill="#FFE66D" opacity=".95"/><circle cx="830" cy="640" r="230" fill="#FFE66D" opacity=".25"/>
    ${birds}${yr}
    <g transform="translate(0,${tilt})">
      <rect x="-40" y="1000" width="230" height="1100" fill="#FF5D8F"/><rect x="900" y="960" width="240" height="1100" fill="#FFD166"/>
      ${[0,1,2,3,4,5].map(i=>`<rect x="10" y="${1060+i*150}" width="120" height="70" rx="8" fill="#C2185B" opacity=".7"/><rect x="950" y="${1020+i*150}" width="120" height="70" rx="8" fill="#E0A800" opacity=".7"/>`).join('')}
      <rect x="170" y="760" width="740" height="1300" fill="#2EC4B6"/>
      <rect x="150" y="740" width="780" height="40" fill="#F7F1E3"/>
      <path d="M150,740 L540,640 L930,740Z" fill="#FF9F1C"/>
      ${win}
    </g>`, html:pill('MUMBAI',660,lt,.7,'#1A1033','#fff',48)};
}});
// 4. Terrace, 7 women
S.push({d:2, f(lt){
  const cols=['#F72585','#FFD60A','#7209B7','#06D6A0','#FF7F11','#4361EE','#E63946'];
  const skins=['#B5713D','#8D5524','#C68642','#A0642F','#B97A4B','#93592E','#C07A45'];
  let w='';
  const pos=[[160,1330,.95],[400,1300,1],[680,1300,1],[920,1330,.95],[280,1560,1.08],[540,1580,1.12],[800,1560,1.08]];
  pos.forEach(([x,y,s],i)=>{const p=prog(lt,.05+i*.08,.35); if(p<=0) return; const sc=eBack(p)*s;
    w+=woman(x,y,sc,cols[i],{skin:skins[i],armL:Math.sin(lt*6+i)*6,armR:Math.cos(lt*6+i)*6});
    w+=`<ellipse cx="${x}" cy="${y+105*s}" rx="${70*sc}" ry="${18*sc}" fill="#8B5A2B"/><ellipse cx="${x}" cy="${y+100*s}" rx="${42*sc}" ry="${11*sc}" fill="#FFF3D6"/>`;});
  return {svg:`${bgGrad('g4','#FFD59E','#FF8C61')}
     <circle cx="880" cy="380" r="120" fill="#FFE66D" opacity=".9"/>
     <rect x="0" y="880" width="260" height="300" fill="#FF5D8F" opacity=".8"/><rect x="760" y="820" width="320" height="360" fill="#2EC4B6" opacity=".8"/>
     <rect x="300" y="960" width="200" height="220" fill="#7209B7" opacity=".55"/>
     <path d="M0,640 H1080" stroke="#6B5B4B" stroke-width="3"/>
     ${['#F72585','#FFD60A','#06D6A0','#4361EE','#FF7F11'].map((c,i)=>`<path d="M${120+i*190},640 l${-6+Math.sin(lt*3+i)*5},70 h56 l${6+Math.sin(lt*3+i)*5},-70Z" fill="${c}"/>`).join('')}
     <rect x="0" y="1150" width="1080" height="80" fill="#F4A261"/><rect x="0" y="1150" width="1080" height="16" fill="#FFE8D0"/>
     <rect x="0" y="1230" width="1080" height="690" fill="#E76F51"/>
     ${[0,1,2,3,4,5,6].map(i=>`<path d="M0,${1300+i*95} H1080" stroke="#D9573A" stroke-width="4"/>`).join('')}
     ${w}${hl('7 HOUSEWIVES',470,lt,.25,112,'#fff',{stroke:'#7A1F00'})}`, html:''};
}});
// 5. Rolling - no degree, no experience
S.push({d:2, f(lt){
  const r=lerp(170,265,eOut(clamp(lt/2))), py=1150+Math.sin(lt*7)*90;
  let grain=''; for(let i=0;i<14;i++) grain+=`<path d="M0,${700+i*90} Q540,${680+i*90+((i%3)-1)*30} 1080,${710+i*90}" stroke="#A9612F" stroke-width="5" fill="none" opacity=".5"/>`;
  const X=(x,y,d)=>{const p=prog(lt,d,.3);return p<=0?'':`<g transform="translate(${x},${y}) scale(${eBack(p)})"><circle r="44" fill="#E63946"/><path d="M-18,-18 L18,18 M18,-18 L-18,18" stroke="#fff" stroke-width="11" stroke-linecap="round"/></g>`;};
  return {svg:`${bgGrad('g5','#D98B4E','#B8662E')}${grain}${radial('r5','#FFE8C2',.4,540,1150,700)}
     <ellipse cx="540" cy="1170" rx="${r+20}" ry="${(r+20)*.55}" fill="rgba(0,0,0,.18)"/>
     <ellipse cx="540" cy="1150" rx="${r}" ry="${r*.55}" fill="#FFF3D6" stroke="#EAD7B0" stroke-width="6"/>
     <g transform="translate(540,${py})">
       <rect x="-330" y="-34" width="660" height="68" rx="34" fill="#E9B872" stroke="#B98242" stroke-width="5"/>
       <rect x="-470" y="-22" width="150" height="44" rx="22" fill="#C98F4A"/><rect x="320" y="-22" width="150" height="44" rx="22" fill="#C98F4A"/>
       <ellipse cx="-390" cy="0" rx="95" ry="70" fill="#9C5B2E"/><ellipse cx="390" cy="0" rx="95" ry="70" fill="#9C5B2E"/>
       <rect x="-330" y="-60" width="22" height="120" rx="8" fill="#F72585" transform="rotate(10)"/><rect x="-300" y="-60" width="16" height="120" rx="8" fill="#FFD60A" transform="rotate(10)"/>
       <rect x="308" y="-60" width="22" height="120" rx="8" fill="#06D6A0" transform="rotate(-10)"/><rect x="284" y="-60" width="16" height="120" rx="8" fill="#4361EE" transform="rotate(-10)"/>
     </g>
     ${dust(40,21,lt,'#FFFFFF',[150,800,780,700])}
     ${X(190,470,.2)}${X(190,660,.55)}`,
   html:pill('NO DEGREE',470,lt,.2,'#fff','#1A1033',60,{dx:60})+pill('NO EXPERIENCE',660,lt,.55,'#fff','#1A1033',60,{dx:60})};
}});
// 6. Day 1: 4 packets
S.push({d:3, f(lt){
  let pk=''; let cnt=0;
  [[330,1020],[750,1020],[330,1420],[750,1420]].forEach(([x,y],i)=>{
    const t0=.35+i*.45, p=clamp((lt-t0)/.45); if(p<=0) return; cnt++;
    const drop=p<.6? -700*(1-eIn(p/.6)) : Math.sin((p-.6)/.4*Math.PI)*-40*(1-p);
    const sq=p>.55&&p<.75?0.9:1;
    pk+=`<g transform="translate(${x},${y+drop}) scale(${1/sq},${sq}) rotate(${(i%2?4:-4)})">
      <ellipse cx="0" cy="190" rx="170" ry="26" fill="rgba(0,0,0,.25)"/>
      <rect x="-160" y="-170" width="320" height="350" rx="26" fill="#D7A86E" stroke="#A97B45" stroke-width="7"/>
      <path d="M-160,-110 H160" stroke="#A97B45" stroke-width="5"/>
      <path d="M0,-170 V180 M-160,20 H160" stroke="#E63946" stroke-width="10"/>
      <circle cx="0" cy="20" r="70" fill="#FFF3D6" stroke="#E63946" stroke-width="8"/>
      ${papad(0,20,52,40+i)}</g>`;});
  return {svg:`${bgGrad('g6','#C9184A','#7209B7')}${radial('r6','#FF8FAB',.45)}
    ${sparkles(20,61,lt,['#FFD60A','#fff'])}${pk}
    ${hl(cnt+' PACKETS',560,lt,.1,150,'#FFD60A')}`, html:pill('DAY 1',380,lt,0,'#fff','#C9184A',54)};
}});
// 7. Growth 7 -> 300+
S.push({d:3, f(lt){
  const cols=['#F72585','#7209B7','#4361EE','#06D6A0','#FF7F11','#E63946','#FFD60A'];
  const cells=[]; for(let r=0;r<17;r++)for(let c=0;c<18;c++){const x=75+c*55,y=860+r*60;cells.push([x,y,Math.hypot(x-540,(y-1360)*1.2)]);}
  cells.sort((a,b)=>a[2]-b[2]);
  const n=Math.round(lerp(7,300,eInOut(clamp((lt-.2)/2.1)))); let ic='';
  for(let i=0;i<Math.min(n,cells.length);i++){const [x,y]=cells[i];const age=clamp((n-i)/8);
    ic+=`<use href="#wi" x="${x-20*age}" y="${y-30*age}" width="${40*age}" height="${60*age}" style="color:${cols[i%7]}"/>`;}
  return {svg:`${bgGrad('g7','#FFE29A','#FF9F1C')}${radial('r7','#fff',.4,540,1300,700)}${ic}
    ${hl(fmt(n)+(n>=300?'+':''),480,lt,0,230,'#fff',{stroke:'#7A1F00'})}`,
   html:pill('AURATEIN JUDTI GAYIN',690,lt,.3,'#1A1033','#FFD60A',48)};
}});
// 8. 45,000 women (modern)
S.push({d:3.5, f(lt){
  const z=lerp(3.2,1,eOut(clamp(lt/2.6)));
  const cols=['#F72585','#4CC9F0','#FFD60A','#06D6A0','#B5179E','#FF7F11'];
  const R=rng(8); let ic='';
  for(let r=0;r<34;r++)for(let c=0;c<26;c++){const x=10+c*41+(r%2)*20,y=560+r*44;
    ic+=`<use href="#wi" x="${x}" y="${y}" width="28" height="42" style="color:${cols[Math.floor(R()*6)]}"/>`;}
  const v=lerp(300,45000,eInOut(clamp((lt-.2)/2)));
  return {svg:`${bgGrad('g8','#10002B','#5A189A')}${radial('r8','#F72585',.35,540,1300,900)}
     <g transform="translate(540,1300) scale(${z}) translate(-540,-1300)">${ic}</g>
     <rect y="0" width="1080" height="820" fill="url(#g8f)"/><defs><linearGradient id="g8f" x1="0" y1="0" x2="0" y2="1"><stop offset=".55" stop-color="#10002B"/><stop offset="1" stop-color="#10002B" stop-opacity="0"/></linearGradient></defs>
     ${hl(fmt(v),470,lt,0,220,'#4CC9F0',{stroke:'#10002B'})}`,
   html:pill('TODAY',300,lt,0,'#FFD60A','#10002B',46)+pill('WOMEN',680,lt,.4,'#F72585','#fff',58)};
}});
// 9. Across India
S.push({d:2.5, f(lt){
  const truck=(x,y,s,c1,c2)=>{const rot=lt*400;
    const wheel=(wx)=>`<g transform="translate(${wx},70) rotate(${rot})"><circle r="36" fill="#222"/><circle r="16" fill="#bbb"/><path d="M-30,0 H30 M0,-30 V30" stroke="#888" stroke-width="5"/></g>`;
    return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-220" y="-120" width="300" height="180" rx="12" fill="${c2}"/>
      <text x="-70" y="-10" text-anchor="middle" font-family="Poppins" font-weight="900" font-size="54" fill="${c1}">PAPAD</text>
      <path d="M90,-70 H170 L220,-10 V60 H90Z" fill="${c1}"/><path d="M110,-55 H165 L200,-15 H110Z" fill="#BDE0FE"/>
      ${wheel(-150)}${wheel(-40)}${wheel(160)}</g>`;};
  let trucks=''; [[0,'#F72585','#FFD60A'],[560,'#4361EE','#06D6A0'],[1120,'#7209B7','#FF7F11']].forEach(([o,a,b])=>{
    const x=((lt*420+o)%1680)-300; trucks+=truck(x,1240,1,a,b);});
  let trees=''; for(let i=0;i<9;i++){const x=((i*170-lt*600)%1530+1530)%1530-200; trees+=`<rect x="${x-8}" y="1060" width="16" height="70" fill="#6B4226"/><circle cx="${x}" cy="1040" r="${48}" fill="${i%2?'#2DC653':'#25A244'}"/>`;}
  const pins=[['DELHI',270,690,.15],['MUMBAI',800,640,.35],['KOLKATA',420,880,.55],['CHENNAI',860,880,.75]];
  let pn='',ph='';
  pins.forEach(([n,x,y,d])=>{const p=prog(lt,d,.35); if(p<=0) return; const sc=eBack(p), bob=Math.sin(lt*4+x)*8;
    pn+=`<g transform="translate(${x},${y+bob}) scale(${sc})"><path d="M0,0 C-26,-36 -42,-58 -42,-84 A42,42 0 1 1 42,-84 C42,-58 26,-36 0,0Z" fill="#E63946" stroke="#fff" stroke-width="6"/><circle cx="0" cy="-84" r="16" fill="#fff"/></g>`;
    ph+=pill(n,y+bob+45,lt,d,'#fff','#1A1033',34,{dx:x-540});});
  return {svg:`${bgGrad('g9','#4CC9F0','#4361EE')}
    <circle cx="900" cy="300" r="90" fill="#FFE66D"/>
    <path d="M0,1100 Q270,960 540,1060 T1080,1040 V1920 H0Z" fill="#80ED99"/>
    ${trees}<rect x="0" y="1150" width="1080" height="230" fill="#3A3A4A"/>
    ${[0,1,2,3,4,5,6].map(i=>{const x=((i*200-lt*700)%1400+1400)%1400-200;return `<rect x="${x}" y="1258" width="110" height="14" rx="7" fill="#FFD60A"/>`;}).join('')}
    <rect x="0" y="1380" width="1080" height="540" fill="#57CC99"/>
    ${[0,1,2,3,4,5].map(i=>`<path d="M0,${1440+i*80} H1080" stroke="#38A3A5" stroke-width="10" opacity=".5"/>`).join('')}
    ${trucks}${pn}${hl('POORE INDIA MEIN',470,lt,.05,96,'#fff',{stroke:'#10002B'})}`, html:ph};
}});
// 10. No boss
S.push({d:2.5, f(lt){
  const strike=clamp((lt-.75)/.3);
  return {svg:`${bgGrad('g10','#1B1B3A','#0B0B1A')}
    <polygon points="440,0 640,0 900,1700 180,1700" fill="#FFF6D5" opacity=".08"/>${radial('r10','#FFF6D5',.25,540,1250,600)}
    <ellipse cx="540" cy="1640" rx="330" ry="60" fill="rgba(0,0,0,.5)"/>
    <g transform="translate(540,1150)">
      <rect x="-190" y="-330" width="380" height="420" rx="90" fill="#26262E"/><rect x="-150" y="-290" width="300" height="340" rx="70" fill="#34343F"/>
      <rect x="-160" y="-290" width="40" height="300" rx="20" fill="#4A4A58" opacity=".7"/>
      <rect x="-230" y="80" width="460" height="90" rx="40" fill="#26262E"/>
      <rect x="-260" y="-40" width="60" height="160" rx="25" fill="#1E1E25"/><rect x="200" y="-40" width="60" height="160" rx="25" fill="#1E1E25"/>
      <rect x="-20" y="170" width="40" height="190" fill="#55555F"/>
      <path d="M0,360 L-230,450 M0,360 L230,450 M0,360 L-120,480 M0,360 L120,480" stroke="#55555F" stroke-width="26" stroke-linecap="round"/>
      ${[-230,230,-120,120].map(x=>`<circle cx="${x}" cy="${x%230?485:455}" r="26" fill="#111"/>`).join('')}
    </g>${dust(35,31,lt,'#FFF6D5',[250,600,580,1100])}
    ${hl('BOSS?',500,lt,.1,220,'#fff',{stroke:'#0B0B1A'})}
    ${strike>0?`<path d="M260,560 L${lerp(260,820,eOut(strike))},${lerp(560,420,eOut(strike))}" stroke="#E63946" stroke-width="34" stroke-linecap="round"/>`:''}`,
   html:pill('KOI BOSS NAHI',720,lt,1.05,'#E63946','#fff',58)};
}});
// 11. All owners
S.push({d:3.5, f(lt){
  const cols=['#7209B7','#FFD60A','#F72585','#06D6A0','#4361EE'], skins=['#8D5524','#C68642','#B5713D','#A0642F','#C07A45'];
  let w=''; [[150,1400,1],[345,1360,1.05],[540,1340,1.1],[735,1360,1.05],[930,1400,1]].forEach(([x,y,s],i)=>{
    const bob=Math.sin(lt*5+i*1.3)*10; w+=woman(x,y+bob,s,cols[i],{skin:skins[i],armL:-20,armR:-20});
    const p=prog(lt,.9+i*.12,.35); if(p>0){const sc=eBack(p)*s;
      w+=`<g transform="translate(${x},${y+bob-235*s}) scale(${sc})"><path d="M-40,20 L-48,-28 L-20,-6 L0,-40 L20,-6 L48,-28 L40,20Z" fill="#FFD60A" stroke="#C77D00" stroke-width="5" stroke-linejoin="round"/><circle cx="0" cy="-40" r="7" fill="#E63946"/></g>`;}});
  let hearts=''; const R=rng(44); for(let i=0;i<14;i++){const x=80+R()*920,sp=120+R()*160,ph=R()*3, y=1650-((lt+ph)*sp)%900, sz=.6+R()*.8;
    hearts+=`<path transform="translate(${x.toFixed(0)},${y.toFixed(0)}) scale(${sz.toFixed(2)})" d="M0,12 C-30,-10 -24,-34 -8,-34 C-2,-34 0,-28 0,-24 C0,-28 2,-34 8,-34 C24,-34 30,-10 0,12Z" fill="#fff" opacity=".7"/>`;}
  return {svg:`${bgGrad('g11','#FF99C8','#F72585')}${radial('r11','#fff',.35,540,1200,800)}${hearts}
     <rect x="0" y="1500" width="1080" height="420" fill="#B5179E" opacity=".5"/>${w}
     ${hl('ALL OWNERS',470,lt,.1,138,'#FFD60A',{stroke:'#4A0033'})}`,
   html:pill('SAB EK DOOSRE KI ‘BEHEN’',670,lt,.5,'#fff','#B5179E',44)};
}});
// 12. Elder portrait
S.push({d:2.5, f(lt){
  const z=lerp(1,1.08,clamp(lt/2.5)), blink=Math.max(0,1-Math.abs(lt-1.3)/0.08);
  return {svg:`${bgGrad('g12','#5EEAD4','#0F766E')}${radial('r12','#FFF6D5',.5,540,1150,750)}
    ${sparkles(24,12,lt,['#fff','#FFD60A'])}
    <g transform="translate(540,1250) scale(${z}) translate(-540,-1250)">${woman(540,1350,3.3,'#F8F4EC',{grey:true,glasses:true,headCover:true,skin:'#A0642F',blink,noArms:true})}</g>
    ${hl('1959 → AAJ',430,lt,.2,150,'#fff',{stroke:'#0B3B36'})}`,
   html:pill('Ek chhat se… poore desh tak',620,lt,.6,'#FFD60A','#0B3B36',46)};
}});
// 13. System > Paisa
S.push({d:3, f(lt){
  const dp=clamp(lt/.55), py=lerp(-300,1080,eIn(dp)), hit=lt-.55;
  let burst=''; if(hit>0){const R=rng(13); for(let i=0;i<90;i++){const a=R()*Math.PI*2, v=300+R()*900, t=Math.min(hit,1.6);
    const x=540+Math.cos(a)*v*t*(1-t*.3), y=1150+Math.sin(a)*v*t*.6*(1-t*.3)+120*t*t;
    burst+=`<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(4+R()*14).toFixed(1)}" fill="#FFFDF5" opacity="${clamp(1-t/1.6).toFixed(2)}"/>`;}}
  const shake=hit>0&&hit<.25?Math.sin(hit*90)*14*(1-hit/.25):0;
  return {svg:`${bgGrad('g13','#3C1642','#1A0B1E')}${radial('r13','#FFB703',.35,540,1150,650)}
    <g transform="translate(${shake},0)">
     <ellipse cx="540" cy="1190" rx="330" ry="120" fill="#8B5A2B"/><ellipse cx="540" cy="1170" rx="330" ry="120" fill="#C98F4A"/>
     <ellipse cx="540" cy="1160" rx="230" ry="80" fill="#FFF3D6"/>
     <g transform="translate(540,${py}) rotate(${lerp(-12,0,dp)})"><rect x="-340" y="-36" width="680" height="72" rx="36" fill="#E9B872" stroke="#B98242" stroke-width="5"/>
      <rect x="-470" y="-22" width="140" height="44" rx="22" fill="#C98F4A"/><rect x="330" y="-22" width="140" height="44" rx="22" fill="#C98F4A"/></g>
     ${burst}</g>
    ${hl('SYSTEM',430,lt,.8,190,'#FFD60A',{stroke:'#1A0B1E'})}${hl('>',600,lt,1.0,150,'#F72585',{stroke:'#1A0B1E'})}${hl('PAISA',760,lt,1.15,170,'#fff',{stroke:'#1A0B1E'})}`, html:''};
}});
// 14. End card
S.push({d:3, f(lt){
  const sp=eOut(clamp((lt-.3)/.6))*90;
  const half=(side)=>{const s=side; let jag='M0,-200 L-16,-140 L14,-90 L-12,-30 L16,20 L-14,80 L12,140 L0,200';
    return `<g transform="translate(${540+s*sp},1150) rotate(${s*sp*.15})"><clipPath id="c${s>0?'r':'l'}"><path d="${jag} ${s>0?'L240,200 L240,-200Z':'L-240,200 L-240,-200Z'}"/></clipPath>
      <g clip-path="url(#c${s>0?'r':'l'})">${papad(0,0,200,77)}</g></g>`;};
  let crumbs=''; if(lt>.3){const R=rng(14),t=Math.min(lt-.3,1.5); for(let i=0;i<24;i++){const a=-Math.PI/2+(R()-.5)*2,v=300+R()*500;
    crumbs+=`<circle cx="${(540+Math.cos(a)*v*t).toFixed(0)}" cy="${(1150+Math.sin(a)*v*t+700*t*t).toFixed(0)}" r="${(5+R()*9).toFixed(1)}" fill="#E8A93A"/>`;}}
  return {svg:`${bgGrad('g14','#F72585','#3A0CA3')}${radial('r14','#FFD60A',.3,540,1150,700)}
    ${sparkles(22,140,lt,['#fff','#FFD60A','#4CC9F0'])}${half(-1)}${half(1)}${crumbs}
    ${hl('AGLA BRAND',420,lt,.1,140,'#fff',{stroke:'#2A0845'})}${hl('KAUNSA?',580,lt,.3,170,'#FFD60A',{stroke:'#2A0845'})}`,
   html:pill('Comment karo 👇',800,lt,.7,'#fff','#B5179E',52)+pill('Follow @mindset_mode_in',1560,lt,1.0,'#FFD60A','#2A0845',50)};
}});

/* ---------- timeline + transitions ---------- */
let acc=0; S.forEach(s=>{s.s=acc; acc+=s.d; s.e=acc;});
window.DURATION=acc;
const T=0.5;
const TT={7:'circle',9:'whip',12:'circle'}; // transition INTO scene index
const SUBS=[
 [0.15,2.0,'₹80 udhaar liye…'],[2.0,4.5,'…aaj ₹1,600 crore ka brand.'],[4.5,7,'1959, Mumbai.'],
 [7,9,'Ek chhat pe 7 housewives.'],[9,11,'Na degree, na experience.'],[11,14,'Pehle din bane sirf 4 packet.'],
 [14,17,'Do saal mein 150. Teen saal mein 300+.'],[17,20.5,'Aaj 45,000 auratein…'],[20.5,23,'…poore India mein.'],
 [23,25.5,'Aur twist? Yahan koi boss nahi.'],[25.5,29,'Har member owner hai.'],
 [31.5,34.5,'Business ke liye paisa nahi… system chahiye.']];
const stage=document.getElementById('stage');
const els=S.map(()=>{const d=document.createElement('div');d.className='scene';d.innerHTML='<div class="inner"></div>';stage.appendChild(d);return d;});
const ring=document.createElement('div');ring.id='ring';stage.appendChild(ring);
const handle=document.createElement('div');handle.id='handle';handle.textContent='@mindset_mode_in';stage.appendChild(handle);
const subs=document.createElement('div');subs.id='subs';stage.appendChild(subs);

window.render=function(t){
  ring.style.display='none';
  S.forEach((sc,i)=>{
    const el=els[i];
    const a=i>0?sc.s-T/2:-1, b=i<S.length-1?sc.e+T/2:1e9;
    if(t<a||t>b){el.style.display='none';return;}
    el.style.display='block'; el.style.zIndex=i;
    const lt=t-sc.s;
    const pin=i>0?clamp((t-a)/T):1, pout=i<S.length-1?clamp((t-(sc.e-T/2))/T):0;
    let tf='',filt='',op=1,clip='none';
    // incoming
    if(pin<1){const ty=TT[i]||'zoom';
      if(ty==='zoom'){const e=eOut(pin);tf+=`scale(${0.72+0.28*e})`;op=e;filt=`blur(${(1-e)*16}px)`;}
      if(ty==='whip'){const e=eInOut(pin);tf+=`translateX(${(1-e)*1080}px)`;filt=`blur(${Math.sin(e*Math.PI)*22}px)`;}
      if(ty==='circle'){const e=eInOut(pin),r=e*1350;clip=`circle(${r}px at 50% 52%)`;
        ring.style.display='block';const rr=r+14;Object.assign(ring.style,{left:(540-rr)+'px',top:(1920*.52-rr)+'px',width:2*rr+'px',height:2*rr+'px',
          border:'28px solid #FFD60A',boxSizing:'border-box',zIndex:100,opacity:String(1-e*.6)});}
    }
    // outgoing
    if(pout>0){const ty=TT[i+1]||'zoom';
      if(ty==='zoom'){const e=eIn(pout);tf+=` scale(${1+0.7*e})`;op*=1-e;filt=`blur(${e*16}px)`;}
      if(ty==='whip'){const e=eInOut(pout);tf+=` translateX(${-e*1080}px)`;filt=`blur(${Math.sin(e*Math.PI)*22}px)`;}
      if(ty==='circle'){const e=eInOut(pout);tf+=` scale(${1+0.12*e})`;}
    }
    el.style.transform=tf||'none'; el.style.opacity=op; el.style.filter=filt||'none'; el.style.clipPath=clip;
    const kb=1+0.05*clamp(lt/sc.d,-.2,1.2);
    const r=sc.f(lt);
    el.firstChild.style.transform=`scale(${kb})`;
    el.firstChild.innerHTML=`<svg viewBox="0 0 1080 1920" width="1080" height="1920">${r.svg}</svg>${r.html||''}`;
  });
  // subtitles
  const sb=SUBS.find(s=>t>=s[0]&&t<s[1]);
  if(sb){const k=clamp(Math.min((t-sb[0])/.15,(sb[1]-t)/.15));subs.innerHTML=`<div style="opacity:${k};transform:translateY(${(1-k)*14}px)">${sb[2]}</div>`;}
  else subs.innerHTML='';
};

/* ---------- sound cues (names from tools/sfx.py LIBRARY) ---------- */
const cues=[];
const cue=(t,sfx,gain=1)=>cues.push({t:+t.toFixed(3),sfx,gain});
S.forEach((sc,i)=>{ if(i===0) return; const ty=TT[i]||'zoom', b=sc.s-T/2;
  cue(b, ty==='whip'?'swish':ty==='circle'?'whoosh_long':'whoosh', ty==='zoom'?0.55:0.75); });
const at=(i,dt)=>S[i].s+dt;
cue(at(0,.1),'hit',.9); cue(at(0,.45),'pop',.6);                                   // ₹80, UDHAAR
for(let k=0;k<12;k++) cue(at(1,.1+k*.1),'counter',.35); cue(at(1,1.3),'ding',.6); cue(at(1,1.35),'pop_high',.5);
[0,1,2,3].forEach(k=>cue(at(2,.15+k*.12),'key',.6)); cue(at(2,.7),'pop',.5);       // 1959 typed
for(let k=0;k<7;k++) cue(at(3,.05+k*.08),'pop_low',.35); cue(at(3,.25),'pop',.55);  // 7 women
cue(at(4,.2),'buzz',.35); cue(at(4,.55),'buzz',.35);                               // NO / NO
[0,1,2,3].forEach(k=>cue(at(5,.35+k*.45+.27),'hit',.45)); cue(at(5,0),'pop',.5);    // packets land
for(let k=0;k<20;k++) cue(at(6,.2+k*.1),'counter',.3); cue(at(6,.3),'pop',.5);
cue(at(7,-1.0),'riser_short',.6); for(let k=0;k<18;k++) cue(at(7,.2+k*.11),'counter',.3); cue(at(7,2.2),'ding',.7); cue(at(7,.4),'pop_high',.5);
[0,1,2,3].forEach(k=>cue(at(8,.15+k*.2),'pop',.45));                               // city pins
cue(at(9,.1),'pop_low',.6); cue(at(9,.75),'swish',.6); cue(at(9,1.05),'hit',.7);  // BOSS? strike
for(let k=0;k<5;k++) cue(at(10,.9+k*.12),'ding',.25); cue(at(10,.1),'pop',.55);    // crowns
cue(at(11,0),'pad',.55); cue(at(11,.6),'pop',.4);                                  // emotional beat
cue(at(12,.55),'boom',.9); cue(at(12,.8),'pop_high',.5); cue(at(12,1.0),'pop',.5); cue(at(12,1.15),'hit',.6);
cue(at(13,.3),'shutter',.6); cue(at(13,.7),'pop',.5); cue(at(13,1.0),'ding',.6);   // papad crack, CTA
cue(0,'drone',.25);

window.REEL={width:1080,height:1920,fps:30,duration:acc,cues,seek:t=>window.render(t)};
window.REEL_READY=document.fonts.ready.then(()=>Promise.all(['700','800','900'].map(w=>document.fonts.load(`${w} 40px Poppins`,'₹0123'))))
  .then(()=>new Promise(r=>setTimeout(r,300)));
window.render(0);
</script></body></html>
